name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치지 않도록 한 번에 하나씩만 실행
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: UOS-MrWorld/mr-world-cuty-client
          ref: main
          path: frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_VOICE_API_BASE_URL: https://mr-world-cuty-voice.onrender.com/api/v1
        run: |
          npm ci
          npm run build

      - name: Add frontend to Spring resources
        run: |
          mkdir -p src/main/resources/static
          find src/main/resources/static -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -R frontend/dist/. src/main/resources/static/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # 테스트가 통과해야만 배포
      - name: Test & Build
        run: ./gradlew test bootJar

      - name: Prepare jar
        run: cp "$(ls build/libs/*.jar | grep -v plain)" app.jar

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload jar
        run: scp -i ~/.ssh/key.pem app.jar "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/cuty/app.jar.new"

      # 새 jar로 교체 후 재시작한다. /actuator/health가 HTTP 200(UP)일 때만 성공으로 본다.
      # (예전에는 응답 코드가 000만 아니면 성공으로 봐서 500·404도 통과했다.)
      # 시간 안에 200이 오지 않으면 이전 jar로 롤백하고, 롤백한 버전도 같은 기준으로 확인한다.
      - name: Restart & health check
        run: |
          ssh -i ~/.ssh/key.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' <<'EOF'
          set -e
          cd /opt/cuty
          HEALTH_URL="localhost:8080/actuator/health"

          # 최대 40회(3초 간격, 약 2분) 확인해 HTTP 200이 오면 0, 끝내 오지 않으면 1을 반환한다.
          wait_healthy() {
            local code="000"
            for i in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
              if [ "$code" = "200" ]; then
                echo "헬스체크 통과 (HTTP $code, ${i}회차)"
                return 0
              fi
              sleep 3
            done
            echo "헬스체크 실패 (마지막 응답 HTTP $code)"
            return 1
          }

          if [ -f app.jar ]; then cp app.jar app.jar.bak; fi
          mv app.jar.new app.jar
          sudo systemctl restart cuty

          if wait_healthy; then
            exit 0
          fi

          echo "새 버전 기동 실패"
          sudo journalctl -u cuty -n 50 --no-pager
          if [ -f app.jar.bak ]; then
            echo "이전 버전으로 롤백"
            cp app.jar.bak app.jar
            sudo systemctl restart cuty
            if wait_healthy; then
              echo "롤백 버전 정상 기동"
            else
              echo "롤백 버전도 비정상: 서버 확인 필요"
              sudo journalctl -u cuty -n 50 --no-pager
            fi
          fi
          exit 1
          EOF
