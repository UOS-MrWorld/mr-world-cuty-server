spring:
  application:
    name: yaho
  datasource:
    url: jdbc:mysql://localhost:3306/yaho?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:change-me-in-local-env}
  access-token-expiration-ms: 1800000
  refresh-token-expiration-ms: 1209600000
