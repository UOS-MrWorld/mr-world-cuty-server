spring.application.name=yaho

spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# 공개 회원가입은 고객 계정만 허용한다. 직원 계정은 운영자가 별도로 생성한다.
auth.public-staff-signup-enabled=${PUBLIC_STAFF_SIGNUP_ENABLED:false}

# 분리 배포가 필요한 경우에만 쉼표로 구분해 추가한다. 통합 배포는 같은 origin을 사용한다.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

#DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#jwt
jwt.secret=${JWT_SECRET}
jwt.access-expiration-ms=1800000
jwt.refresh-expiration-ms=1209600000

#SMS (셋 중 하나라도 비어 있으면 실제로 보내지 않고 로그만 남긴다)
sms.api.key=${SMS_API_KEY:}
sms.api.secret=${SMS_API_SECRET:}
sms.sender=${SMS_SENDER:}

#Actuator (배포 헬스체크용. health만 노출하고 DB 등 세부 정보는 응답에 넣지 않는다)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
